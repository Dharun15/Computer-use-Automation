<!DOCTYPE html>
<html>
<head><title>MemberServ 3.2 - Search Results</title>
<style>
  body { font-family: "MS Sans Serif", Tahoma, sans-serif; font-size: 13px; background: #d4d0c8; margin: 0; }
  .titlebar { background: #000080; color: white; padding: 6px 10px; font-weight: bold; }
  .content { padding: 20px; }
  table { border-collapse: collapse; background: #ece9d8; border: 2px solid #808080; }
  td, th { padding: 6px 10px; border: 1px solid #a9a9a9; }
  th { background: #c0c0c0; text-align: left; }
  a { color: #000080; }
</style>
</head>
<body>
<div class="titlebar">MemberServ 3.2 :: Search Results</div>
<div class="content">
<p>1 record found.</p>
<table>
  <tr><th>Member ID</th><th>Name</th><th>Action</th></tr>
  <tr>
    <td>{{ member.member_id }}</td>
    <td>{{ member.name }}</td>
    <td><a href="/members/{{ member.member_id }}">{{ member.member_id }}</a></td>
  </tr>
</table>
</div>
</body>
</html>
